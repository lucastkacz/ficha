name: check

# `make check` on every push to main and every pull request, but one whose
# files are all Markdown, which none of its steps reads. The ruleset on main
# requires the job "check" to pass before anything merges.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Whether a pull request's files are all Markdown. Then `check` skips its
    # job, which counts as passed, through a condition and not the workflow's
    # `paths-ignore`: a required check whose workflow never runs keeps the
    # pull request waiting, as "Handling skipped but required checks" in
    # GitHub's docs says. Reading the files from git is our own.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      markdown-only: ${{ steps.files.outputs.markdown-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request's merge commit and its parents.
          fetch-depth: 2
      - id: files
        # The files the merge commit changes from its first parent, the base
        # branch. A rename counts both names, and when git can't list them,
        # `check` runs.
        run: |
          if ! files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            echo "::warning::git couldn't list the files this pull request changes, as it says above, so check runs as for any pull request."
            exit 0
          fi
          echo "$files"
          if [[ -n $files ]] && ! grep -qv '\.md$' <<<"$files"; then
            echo "markdown-only=true" >>"$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    # `!cancelled()` runs it also when `changes` was skipped, on a push or a
    # run started by hand, or failed: only a pull request known to be all
    # Markdown skips it.
    if: ${{ !cancelled() && needs.changes.outputs.markdown-only != 'true' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # What `make check`'s builds leave, which the next run builds from: the
      # package's, the render tool's, and Xcode's derived data. They pay off
      # together, as #124 measured: with the package's alone, `swift test`
      # fetches no packages, so Xcode's first build fetches them from GitHub.
      BUILDS: |
        Packages/FichaKit/.build
        scripts/render/.build
        .build/DerivedData
      # What fsrs-rs's build leaves (ADR 0026), cached apart from the builds:
      # the step that restores it says why.
      RUST_BUILDS: |
        ~/.cargo/registry/index
        ~/.cargo/registry/cache
        ~/.cargo/git/db
        Packages/FichaKit/Frameworks
        .build/cargo/debug
      # Where rustup keeps the toolchain that rust-toolchain.toml pins: a
      # folder of its own, which holds that toolchain alone, so its cache
      # leaves out the stable toolchain the image keeps in ~/.rustup.
      # RUSTUP_HOME is rustup's documented way to move it.
      RUSTUP_HOME: ${{ github.workspace }}/.build/rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        # The one .xcode-version names, which Lucas's Mac runs too, so a
        # `make check` that passes there passes here. The image installs each
        # Xcode at /Applications/Xcode_<version>.app, and a new patch version
        # replaces the previous one: then this fails, naming the ones it has.
        run: |
          xcode="/Applications/Xcode_$(cat .xcode-version).app"
          if [[ ! -d $xcode ]]; then
            echo "::error::The runner has no $xcode, the Xcode .xcode-version names. Move the Mac's Xcode and the file to one it has: $(cd /Applications && echo Xcode_*.app)"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Install the iOS platform
        # Xcode builds the iPhone app, for the simulator and, in the String
        # Catalog check, for an iPhone, only with its iOS platform installed,
        # as on the Mac (Xcode › Settings › Components). The image installs it
        # only for its newest Xcodes (actions/runner-images#12541), so this
        # downloads the selected Xcode's, as that announcement suggests. The
        # download can fail and then pass on a re-run (#129), so it tries three
        # times, 30 seconds apart. The retry is our own: GitHub Actions has no
        # option to retry a step.
        run: |
          attempts=3
          delay=30
          for ((attempt = 1; attempt <= attempts; attempt++)); do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            if ((attempt < attempts)); then
              echo "Attempt $attempt of $attempts to download the iOS platform failed: trying again in $delay seconds."
              sleep "$delay"
            fi
          done
          echo "::error::Downloading the iOS platform failed $attempts times, $delay seconds apart: re-run the job."
          exit 1
      - name: Install the tools
        # The ones `make bootstrap` installs on a Mac. The image ships rustup
        # already, through Homebrew as on the Mac, so brew leaves it as it is;
        # it stays in the list for an image that drops it.
        run: brew install xcodegen shellcheck actionlint rustup
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - name: Restore the Rust toolchain
        # The toolchain rustup installed for rust-toolchain.toml, which a run
        # on main saved, keyed by that file: so a run downloads it only after
        # the pin moves. The image's own toolchain can't stand in for it:
        # rustup installs it as stable, a toolchain apart from the pinned
        # version's even when both are the same release. No restore keys: a
        # moved pin starts from no cache, rather than carry the old toolchain
        # into the new one. Caching rustup's folder is our own; Cargo's book
        # lists only Cargo's.
        id: rustup-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Packages/FichaKit/Rust/rust-toolchain.toml') }}
      - name: Install the Rust toolchain
        # The one Packages/FichaKit/Rust/rust-toolchain.toml pins, with its
        # targets and its rustfmt and clippy, as `make bootstrap` installs it.
        # When the step above restored it, rustup finds it whole and
        # downloads nothing.
        run: make rust-toolchain
      - name: Name the runner's image
        # The SDK's compiled modules in the derived data record each SDK file's
        # modification time, and Xcode refuses one whose files changed (#277).
        # Each image of macos-26 installs its Xcodes anew, and the same Xcode's
        # files get other times on each. So the builds' key names the image,
        # from the ImageOS and ImageVersion variables the image sets, as
        # actions/setup-go's advanced usage docs put ImageOS in a cache key;
        # ImageVersion is our own. Runs on a new image build from no cache
        # until a run on main there saves one. Leaving the modules out of the
        # cache instead slowed every run's Xcode builds to about no cache's,
        # as #277 measured. With no image to name, a run builds uncached.
        id: image
        run: |
          if [[ -z ${ImageOS:-} || -z ${ImageVersion:-} ]]; then
            echo "::warning::The runner set no ImageOS or ImageVersion, so the builds' cache key can't name its image, and this run builds without the cache: name the image another way in this step, from what the Set up job step's Runner Image section shows."
            exit 0
          fi
          echo "name=$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
      - name: Restore the builds
        if: steps.image.outputs.name != ''
        # The ones a run on main saved, with actions/cache's restore and save
        # actions, as its caching strategies show them. Other runs, pull
        # requests among them, read main's cache and save none: only runs of
        # their own branch could read what they saved, and it would crowd out
        # main's, as "Caching dependencies to speed up workflows" in GitHub's
        # docs says. A new image, a new Xcode, or new versions of the
        # package's dependencies, start from no cache.
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILDS }}
          key: builds-${{ steps.image.outputs.name }}-${{ hashFiles('.xcode-version', 'Packages/FichaKit/Package.resolved') }}
      - name: Restore fsrs-rs's build
        # Cargo's downloads, as Cargo's book lists them for a CI cache, the
        # XCFramework with the digest that `make fsrs` compares, and clippy's
        # build, keyed by the crate, its lock and rust-toolchain.toml among its
        # files, and the script that builds it: so a run that changes no Rust
        # builds no fsrs-rs, whatever the image, which Rust's builds don't
        # depend on. Saved by runs on main alone, as the builds are. A run
        # that changed the Rust starts from the newest one, for its downloads.
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUST_BUILDS }}
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Packages/FichaKit/Rust/**', 'scripts/build-fsrs.sh') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      - run: make check
      - name: Save the builds
        # After a run on main, unless the cache had them already: a key, once
        # saved, can't be saved again.
        if: github.ref == 'refs/heads/main' && steps.image.outputs.name != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILDS }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Save fsrs-rs's build
        # After a run on main, unless the cache had its key already.
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUST_BUILDS }}
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Save the Rust toolchain
        # After a run on main, unless the cache had its key already.
        if: github.ref == 'refs/heads/main' && steps.rustup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: ${{ steps.rustup-cache.outputs.cache-primary-key }}
