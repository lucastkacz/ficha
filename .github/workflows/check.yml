name: check

# `make check` on every pull request and every push to main. The ruleset on
# main requires this job ("check") to pass before anything merges.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        # The one .xcode-version names, which Lucas's Mac runs too, so a
        # `make check` that passes there passes here. The image installs each
        # Xcode at /Applications/Xcode_<version>.app, and a new patch version
        # replaces the previous one: then this fails, naming the ones it has.
        run: |
          xcode="/Applications/Xcode_$(cat .xcode-version).app"
          if [[ ! -d $xcode ]]; then
            echo "::error::The runner has no $xcode, the Xcode .xcode-version names. Move the Mac's Xcode and the file to one it has: $(cd /Applications && echo Xcode_*.app)"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Install the tools
        # The ones `make bootstrap` installs on a Mac, which the image doesn't ship.
        run: brew install xcodegen shellcheck actionlint
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - run: make check
