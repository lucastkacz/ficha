name: Bug
description: Something in Ficha doesn't work as it should. Claude triages it with /triage.
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: introduced-by
    attributes:
      label: Introduced by
      description: The pull request that caused it, if known (e.g. #12). It measures how often a merge lets a bug through.
