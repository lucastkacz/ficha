# Monthly update PRs, which Lucas merges (CLAUDE.md): their risk:high label
# keeps Claude from merging them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["risk:high"]
  - package-ecosystem: swift
    directory: /Packages/FichaKit
    schedule:
      interval: monthly
    labels: ["risk:high"]
  # Our crate, which pins fsrs-rs, whose upgrade can change intervals
  # (ADR 0026).
  - package-ecosystem: cargo
    directory: /Packages/FichaKit/Rust
    schedule:
      interval: monthly
    labels: ["risk:high"]
