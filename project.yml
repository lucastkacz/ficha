# XcodeGen spec: the source of truth for Ficha.xcodeproj, which is generated
# (`make project`) and never committed or edited by hand.

name: Ficha

options:
  bundleIdPrefix: com.lucastkacz
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: es
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.46.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FichaKit:
    path: Packages/FichaKit

targets:
  Ficha:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: FichaKit
        product: FichaCore
      - package: FichaKit
        product: FichaData
      # The `ficha` CLI ships inside the app, so the two are always the same
      # version. It goes in Contents/Helpers, since Contents/MacOS holds the
      # real Ficha's own `Ficha`, and macOS doesn't tell the two names apart.
      - target: CLI
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        # One module name for both apps below, so the code behaves the same in each.
        PRODUCT_MODULE_NAME: Ficha
        GENERATE_INFOPLIST_FILE: YES
        # Menu bar only: no Dock icon and no main window.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(PRODUCT_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        # Xcode 26's defaults for app targets: main actor by default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # Personal app: signed to run locally, no sandbox, not notarized.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
      # Two apps that run side by side. Each configuration names its app, gives
      # it a bundle identifier of its own, and so preferences of its own, and
      # sets the flag that `AppVariant` reads for its menu-bar icon and data folder.
      configs:
        # Ficha Dev, for development: `make run` builds and opens it.
        Debug:
          PRODUCT_NAME: Ficha Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha.dev
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FICHA_DEV
        # The real Ficha: `make install` puts it in /Applications.
        Release:
          PRODUCT_NAME: Ficha
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FICHA_REAL

  # The `ficha` CLI (ADR 0008): its commands live in FichaKit, and this tool
  # only picks whose cards they open. It's built with each app, with the same
  # flag, and compiles `AppVariant` too, so the CLI inside Ficha Dev opens
  # Ficha Dev's cards, and the one inside the real Ficha opens Lucas's.
  CLI:
    type: tool
    platform: macOS
    sources:
      - path: CLI
      - path: App/AppVariant.swift
    dependencies:
      - package: FichaKit
        product: FichaCLI
    settings:
      base:
        PRODUCT_NAME: ficha
        # Built into the app, never installed on its own.
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FICHA_DEV
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FICHA_REAL

schemes:
  Ficha:
    build:
      targets:
        Ficha: all
    run:
      config: Debug
    archive:
      config: Release
