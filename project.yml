# XcodeGen spec: the source of truth for Ficha.xcodeproj, which is generated
# (`make project`) and never committed or edited by hand.

name: Ficha

options:
  bundleIdPrefix: com.lucastkacz
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  # The app follows the Mac's language, with English as the base (ADR 0009).
  developmentLanguage: en
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.46.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Texts go through String Catalogs, which Xcode fills from the code.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # The release version, CFBundleShortVersionString, changed by hand.
    MARKETING_VERSION: "0.1.0"
    # The build number, CFBundleVersion. The Makefile sets it from git on
    # each build; this one is only for a build outside it.
    CURRENT_PROJECT_VERSION: "1"
    # The real Ficha: signed to run locally, not notarized, until it moves into
    # its sandbox (#310). Ficha Dev signs with Lucas's paid team instead, as
    # its targets' Debug settings say.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
  # Two Mac apps that run side by side, each with its own `ficha` CLI. Each
  # configuration sets the flag that `AppVariant` reads, in the app and in its
  # CLI alike, for the menu-bar icon and the data folder.
  configs:
    # Ficha Dev, for development: `make run` builds and opens it, and
    # `make install-iphone` puts the iPhone app on Lucas's iPhone. On the Mac,
    # it and its CLI share its App Group's folder, named after the team's ID,
    # which Xcode puts before it (ADR 0018).
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG FICHA_DEV
      FICHA_APP_GROUP: $(TeamIdentifierPrefix)com.lucastkacz.ficha.dev
    # The real Ficha: `make install` puts it in /Applications.
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: FICHA_REAL

packages:
  FichaKit:
    path: Packages/FichaKit

# zstd's configuration macros, for each target that links FichaData, whose
# Swift loads zstd's module: FichaKit's `Package.swift` says why, and passes
# the same ones to its own targets (ADR 0015).
settingGroups:
  zstd:
    GCC_PREPROCESSOR_DEFINITIONS:
      - $(inherited)
      - ZSTDLIB_VISIBLE=
      - ZSTDLIB_HIDDEN=
      - ZDICTLIB_VISIBLE=
      - ZDICTLIB_HIDDEN=
      - ZSTDERRORLIB_VISIBLE=
      - ZSTDERRORLIB_HIDDEN=
      - ZSTD_CLEVEL_DEFAULT=3

targets:
  Ficha:
    type: application
    platform: macOS
    sources:
      - path: App
      # The instructions for an AI, which the Import sheet copies: the app
      # bundles the repo's own page, so the two are always the same.
      - path: docs/instructions-for-an-ai.md
        buildPhase: resources
    dependencies:
      - package: FichaKit
        product: FichaCore
      - package: FichaKit
        product: FichaData
      # The `ficha` CLI ships inside the app, so the two are always the same
      # version. It goes in Contents/Helpers, since Contents/MacOS holds the
      # real Ficha's own `Ficha`, and macOS doesn't tell the two names apart.
      - target: CLI
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    # Ficha Dev signs with Lucas's paid team, whose ID this file takes from
    # one that git ignores.
    configFiles:
      Debug: Signing.xcconfig
    settings:
      groups: [zstd]
      base:
        # One module name for both apps below, so the code behaves the same in each.
        PRODUCT_MODULE_NAME: Ficha
        GENERATE_INFOPLIST_FILE: YES
        # Menu bar only: no Dock icon and no main window.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(PRODUCT_NAME)
        # The copyright line, which Settings' About tab shows. It isn't
        # translated.
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Lucas Ariel Tkacz"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        # Xcode 26's defaults for app targets: main actor by default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # The real Ficha: no sandbox, until #310.
        ENABLE_APP_SANDBOX: NO
      # Each configuration names its app and gives it a bundle identifier of
      # its own, and so preferences of its own. It also picks the app's icon,
      # an Icon Composer document in App/, named without its `.icon`: Ficha
      # Dev's is Ficha's drawing in another color, to tell the two apart.
      configs:
        # Ficha Dev runs in the App Sandbox, in its App Group, with the
        # hardened runtime, as the real Ficha will in the Mac App Store (ADR
        # 0018).
        Debug:
          PRODUCT_NAME: Ficha Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha.dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: App/Ficha.entitlements
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES
        Release:
          PRODUCT_NAME: Ficha
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # The `ficha` CLI (ADR 0008): its commands live in FichaKit, and this tool
  # only picks whose cards they open, and, in its sandbox, takes files from
  # Downloads alone. It's built with each app, in the same configuration, and
  # compiles `AppVariant` too, so the CLI inside Ficha Dev opens Ficha Dev's
  # cards, and the one inside the real Ficha opens Lucas's.
  CLI:
    type: tool
    platform: macOS
    sources:
      - path: CLI
        # Its Info.plist and entitlements go in through its settings.
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: App/AppVariant.swift
    dependencies:
      - package: FichaKit
        product: FichaCLI
    configFiles:
      Debug: Signing.xcconfig
    settings:
      groups: [zstd]
      base:
        PRODUCT_NAME: ficha
        # Built into the app, never installed on its own.
        SKIP_INSTALL: YES
      # Ficha Dev's CLI runs in a sandbox of its own, not its app's, which a
      # terminal can't start (ADR 0018): it needs an Info.plist in its binary,
      # with a bundle identifier, the app's with `.cli`. Its entitlements give
      # it Ficha Dev's App Group, and the Downloads folder to read files from,
      # with no `inherit`. A sandbox of its own is our own, as #301 probed:
      # Apple documents a tool that inherits its app's.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha.dev.cli
          INFOPLIST_FILE: CLI/Info.plist
          CREATE_INFOPLIST_SECTION_IN_BINARY: YES
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: CLI/ficha.entitlements
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES

  # Ficha on the iPhone (#97), with files of its own in iPhone/. Stage 1
  # builds it only as Ficha Dev, in the Debug configuration, which its code
  # checks: the real Ficha on the iPhone comes with stage 2. It compiles
  # `AppVariant` too, for the same app name as the Mac's, and a data folder of
  # the same name in its own Application Support.
  iPhone:
    type: application
    platform: iOS
    sources:
      - path: iPhone
        excludes:
          - "*.xcconfig"
      - path: App/AppVariant.swift
      - path: App/AppIcon-Dev.icon
    # It signs automatically with Lucas's paid team, whose ID this file takes
    # from one that git ignores.
    configFiles:
      Debug: Signing.xcconfig
    dependencies:
      - package: FichaKit
        product: FichaCore
      - package: FichaKit
        product: FichaData
    settings:
      groups: [zstd]
      base:
        # One module name, whatever the app's name, as the Mac app's.
        PRODUCT_MODULE_NAME: FichaPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(PRODUCT_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPhone only, upright, as the prototype Lucas picked the screens from.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Xcode 26's defaults for app targets: main actor by default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
      # Ficha Dev's name, icon and bundle identifier, the same as on the Mac.
      # The real Ficha's Release settings come with stage 2.
      configs:
        Debug:
          PRODUCT_NAME: Ficha Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha.dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev

schemes:
  Ficha:
    build:
      targets:
        Ficha: all
    run:
      config: Debug
    archive:
      config: Release
  # `make build-iphone` builds it for the simulator, and `make install-iphone`
  # for Lucas's iPhone.
  iPhone:
    build:
      targets:
        iPhone: all
    run:
      config: Debug
