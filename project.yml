# XcodeGen spec: the source of truth for Ficha.xcodeproj, which is generated
# (`make project`) and never committed or edited by hand.

name: Ficha

options:
  bundleIdPrefix: com.lucastkacz
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  # The app follows the Mac's language, with English as the base (ADR 0009).
  developmentLanguage: en
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.46.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Texts go through String Catalogs, which Xcode fills from the code.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # The release version, CFBundleShortVersionString, changed by hand.
    MARKETING_VERSION: "0.1.0"
    # The build number, CFBundleVersion. The Makefile sets it from git on
    # each build; this one is only for a build outside it.
    CURRENT_PROJECT_VERSION: "1"
    # Signed to run locally, not notarized, unless a target's settings say
    # otherwise: Ficha Dev, and the real Ficha's app and CLI, sign with
    # Lucas's paid team, as their targets' settings say.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
  # Two Mac apps that run side by side, each with its own `ficha` CLI. Each
  # configuration sets the flag that `AppVariant` reads, in the app and in its
  # CLI alike, for the menu-bar icon and the data folder.
  configs:
    # Ficha Dev, for development: `make run` builds and opens it, and
    # `make install-iphone` puts the iPhone app on Lucas's iPhone. On the Mac,
    # it and its CLI share its App Group's folder, named after the team's ID,
    # which Xcode puts before it (ADR 0018).
    # It syncs in the Development environment of Ficha's iCloud container,
    # apart from Lucas's cards, which sync in Production (ADR 0017).
    # `FICHA_URL_SCHEME` is the scheme of the links that open each app, as a
    # click on its widget does, which its Info.plist claims, and which the
    # app and the widget read from their Info.plists (`WidgetHandover`).
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG FICHA_DEV
      FICHA_APP_GROUP: $(TeamIdentifierPrefix)com.lucastkacz.ficha.dev
      FICHA_ICLOUD_ENVIRONMENT: Development
      FICHA_PUSH_ENVIRONMENT: development
      FICHA_URL_SCHEME: ficha-dev
    # The real Ficha: `make install` puts it in /Applications. Its app and its
    # CLI sign with the team and share its App Group's folder, where its last
    # build without the sandbox moves Lucas's data (#309), and run there
    # without the sandbox until #310. Its widget signs to run locally until
    # then, without the team's ID, which Xcode leaves out of the widget's
    # group's name, so it isn't in the app's group.
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: FICHA_REAL
      FICHA_APP_GROUP: $(TeamIdentifierPrefix)com.lucastkacz.ficha
      FICHA_URL_SCHEME: ficha

packages:
  FichaKit:
    path: Packages/FichaKit

# zstd's configuration macros, for each target that links FichaData, whose
# Swift loads zstd's module: FichaKit's `Package.swift` says why, and passes
# the same ones to its own targets (ADR 0015).
settingGroups:
  zstd:
    GCC_PREPROCESSOR_DEFINITIONS:
      - $(inherited)
      - ZSTDLIB_VISIBLE=
      - ZSTDLIB_HIDDEN=
      - ZDICTLIB_VISIBLE=
      - ZDICTLIB_HIDDEN=
      - ZSTDERRORLIB_VISIBLE=
      - ZSTDERRORLIB_HIDDEN=
      - ZSTD_CLEVEL_DEFAULT=3

targets:
  Ficha:
    type: application
    platform: macOS
    sources:
      - path: App
        # Its Info.plist goes in through its settings.
        excludes:
          - Info.plist
      # The instructions for an AI, which the Import sheet copies: the app
      # bundles the repo's own page, so the two are always the same.
      - path: docs/instructions-for-an-ai.md
        buildPhase: resources
    dependencies:
      - package: FichaKit
        product: FichaCore
      - package: FichaKit
        product: FichaData
      - package: FichaKit
        product: FichaSVG
      # The SVG drawer's XPC service, in the app's Contents/XPCServices,
      # where macOS finds it.
      - target: SVGDrawer
      # The widget's extension, in the app's Contents/PlugIns, where macOS
      # finds it.
      - target: Widget
      # Sync through iCloud, the only part that loads CloudKit, which the app
      # alone links (ADR 0017).
      - package: FichaKit
        product: FichaICloud
      # The `ficha` CLI ships inside the app, so the two are always the same
      # version. It goes in Contents/Helpers, since Contents/MacOS holds the
      # real Ficha's own `Ficha`, and macOS doesn't tell the two names apart.
      - target: CLI
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    # Both apps sign with Lucas's paid team, whose ID this file takes from
    # one that git ignores.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      groups: [zstd]
      base:
        # One module name for both apps below, so the code behaves the same in each.
        PRODUCT_MODULE_NAME: Ficha
        # Xcode's Info.plist, with App/Info.plist's link scheme, which the
        # widget's links open the app with.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        # Menu bar only: no Dock icon and no main window.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(PRODUCT_NAME)
        # The copyright line, which Settings' About tab shows. It isn't
        # translated.
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Lucas Ariel Tkacz"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        # Xcode 26's defaults for app targets: main actor by default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # The real Ficha: no sandbox, until #310.
        ENABLE_APP_SANDBOX: NO
      # Each configuration names its app and gives it a bundle identifier of
      # its own, and so preferences of its own. It also picks the app's icon,
      # an Icon Composer document in App/, named without its `.icon`: Ficha
      # Dev's is Ficha's drawing in another color, to tell the two apart.
      configs:
        # Ficha Dev runs in the App Sandbox, in its App Group, with the
        # hardened runtime, as the real Ficha will in the Mac App Store (ADR
        # 0018). It reads and writes the files the user picks in an open or a
        # save panel, as the import's and Export's, which the sandbox won't
        # show without that entitlement. It holds the camera entitlement only
        # to read whether some app runs a camera, as in a meeting: without
        # it, the sandbox hides a running camera. That reading never asks for
        # permission (docs/app-review-notes.md). It holds no network
        # entitlement: the SVG drawer below does. It syncs through iCloud,
        # whose entitlements, and push's, are restricted: they need a
        # provisioning profile, which Xcode makes and keeps through Lucas's
        # account in Xcode, as automatic signing does. The real Ficha, signed
        # with the team too, holds its App Group alone, and takes them once it
        # syncs (#318).
        Debug:
          PRODUCT_NAME: Ficha Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha.dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: App/Ficha.entitlements
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES
        # The real Ficha's last build without the sandbox, which moves Lucas's
        # data into its App Group's folder (#309), signs with the team, as
        # Ficha Dev does, so macOS lets it into the group's folder: its
        # entitlements hold that group alone, until #310 sandboxes it.
        Release:
          PRODUCT_NAME: Ficha
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: App/GroupWithoutSandbox.entitlements

  # The `ficha` CLI (ADR 0008): its commands live in FichaKit, and this tool
  # only picks whose cards they open, and, in its sandbox, takes files from
  # Downloads alone. It's built with each app, in the same configuration, and
  # compiles `AppVariant` too, so the CLI inside Ficha Dev opens Ficha Dev's
  # cards, and the one inside the real Ficha opens Lucas's; `AppVariant`
  # reads a scratch run's name with FichaData.
  CLI:
    type: tool
    platform: macOS
    sources:
      - path: CLI
        # Its Info.plist and entitlements go in through its settings.
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: App/AppVariant.swift
    dependencies:
      - package: FichaKit
        product: FichaCLI
      - package: FichaKit
        product: FichaData
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      groups: [zstd]
      base:
        PRODUCT_NAME: ficha
        # Built into the app, never installed on its own.
        SKIP_INSTALL: YES
      # Ficha Dev's CLI runs in a sandbox of its own, not its app's, which a
      # terminal can't start (ADR 0018): it needs an Info.plist in its binary,
      # with a bundle identifier, the app's with `.cli`. Its entitlements give
      # it Ficha Dev's App Group, and the Downloads folder to read files from,
      # with no `inherit`. A sandbox of its own is our own, as #301 probed:
      # Apple documents a tool that inherits its app's.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha.dev.cli
          INFOPLIST_FILE: CLI/Info.plist
          CREATE_INFOPLIST_SECTION_IN_BINARY: YES
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: CLI/ficha.entitlements
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES
        # The real Ficha's CLI signs with the team too, with the same App
        # Group as its app, which the folder it shares with the app is in,
        # and no sandbox until #310 (#309).
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha.cli
          INFOPLIST_FILE: CLI/Info.plist
          CREATE_INFOPLIST_SECTION_IN_BINARY: YES
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: App/GroupWithoutSandbox.entitlements

  # The SVG drawer (ADR 0018): an XPC service inside each app that draws the
  # SVGs an import brings in, with WebKit, which needs the network
  # entitlement in the sandbox. It's the only part of Ficha that holds it,
  # and it blocks every load. It runs in its sandbox in both apps, the real
  # Ficha's included, which has none of its own until #310, so that both
  # draw the same way. Its bundle identifier is its app's with
  # `.svg-drawer`, which is how the app finds it.
  SVGDrawer:
    type: xpc-service
    platform: macOS
    sources:
      - path: SVGDrawer
        # Its Info.plist and entitlements go in through its settings.
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: FichaKit
        product: FichaSVG
    configFiles:
      Debug: Signing.xcconfig
    settings:
      base:
        # Xcode's Info.plist, with SVGDrawer/Info.plist's XPCService keys.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SVGDrawer/Info.plist
        CODE_SIGN_ENTITLEMENTS: SVGDrawer/SVGDrawer.entitlements
        ENABLE_APP_SANDBOX: YES
        # Built into the app, never installed on its own.
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha.dev.svg-drawer
          CODE_SIGN_IDENTITY: Apple Development
          ENABLE_HARDENED_RUNTIME: YES
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha.svg-drawer

  # The widget with the next card to review (#171): a WidgetKit extension
  # inside each app, which macOS runs in its sandbox, in an App Group, where
  # it reads the cards alone, beside the app and the CLI, which write them.
  # It compiles `AppVariant` too, for its app's name, data folder and group's
  # defaults, and `WidgetHandover`, for what the app hands it there, its link
  # scheme and its log. Its bundle identifier is its app's with `.widget`. Its
  # Info.plist holds the link scheme, as the app's does. Ficha Dev's signs as
  # its CLI does, with Apple Development and no provisioning profile, which a
  # group named after the team needs none of on the Mac, and shares its app's
  # group. The real Ficha's signs to run locally until #310, unlike its app
  # since #309, so its group, named without the team's ID, isn't the app's,
  # and it reads none of Lucas's cards.
  Widget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        # Its Info.plist and entitlements go in through its settings.
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: App/AppVariant.swift
      - path: App/WidgetHandover.swift
    dependencies:
      - package: FichaKit
        product: FichaCore
      - package: FichaKit
        product: FichaData
    configFiles:
      Debug: Signing.xcconfig
    settings:
      groups: [zstd]
      base:
        PRODUCT_NAME: FichaWidget
        # Xcode's Info.plist, with Widget/Info.plist's extension point.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        ENABLE_APP_SANDBOX: YES
        # Built into the app, never installed on its own.
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha.dev.widget
          CODE_SIGN_IDENTITY: Apple Development
          ENABLE_HARDENED_RUNTIME: YES
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha.widget

  # Ficha on the iPhone (#97), with files of its own in iPhone/. Stage 1
  # builds it only as Ficha Dev, in the Debug configuration, which its code
  # checks: the real Ficha on the iPhone comes with stage 2. It compiles
  # `AppVariant` too, for the same app name as the Mac's, and a data folder of
  # the same name in its own Application Support.
  iPhone:
    type: application
    platform: iOS
    sources:
      - path: iPhone
        excludes:
          - "*.xcconfig"
      - path: App/AppVariant.swift
      - path: App/AppIcon-Dev.icon
    # It signs automatically with Lucas's paid team, whose ID this file takes
    # from one that git ignores.
    configFiles:
      Debug: Signing.xcconfig
    dependencies:
      - package: FichaKit
        product: FichaCore
      - package: FichaKit
        product: FichaData
    settings:
      groups: [zstd]
      base:
        # One module name, whatever the app's name, as the Mac app's.
        PRODUCT_MODULE_NAME: FichaPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(PRODUCT_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPhone only, upright, as the prototype Lucas picked the screens from.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Xcode 26's defaults for app targets: main actor by default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
      # Ficha Dev's name, icon and bundle identifier, the same as on the Mac.
      # The real Ficha's Release settings come with stage 2.
      configs:
        Debug:
          PRODUCT_NAME: Ficha Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.lucastkacz.ficha.dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev

schemes:
  Ficha:
    build:
      targets:
        Ficha: all
    run:
      config: Debug
    archive:
      config: Release
  # `make build-iphone` builds it for the simulator, and `make install-iphone`
  # for Lucas's iPhone.
  iPhone:
    build:
      targets:
        iPhone: all
    run:
      config: Debug
